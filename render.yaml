# Render par ek click deploy — Blueprint
services:
  - type: web
    name: youme-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://bhupendarsingh785.github.io"
      - key: DB_PATH
        value: "data/youme.db"
      - key: TRUST_PROXY
        value: "1"
      # Google login — value Render dashboard me daalni hai (repo me secret nahi)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # GitHub login (baad me)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Public URL — callback banane ke liye
      - key: PUBLIC_URL
        sync: false
