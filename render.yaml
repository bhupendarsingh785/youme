# Render par ek click deploy — Blueprint
services:
  - type: web
    name: youme-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://bhupendarsingh785.github.io"
      - key: DB_PATH
        value: "data/youme.db"
      - key: TRUST_PROXY
        value: "1"
      # Google Client ID public hota hai (secret nahi) — yahan hi rakh diya
      - key: GOOGLE_CLIENT_ID
        value: "356143663731-a1qec77dgt1piq1jr3bst72u1b1hldl3.apps.googleusercontent.com"
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # GitHub login (baad me)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Public URL — callback banane ke liye
      - key: PUBLIC_URL
        value: "https://youme-api-yjxc.onrender.com"
