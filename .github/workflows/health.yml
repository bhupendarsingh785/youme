name: YouMe health

# Har 6 ghante: backend, frontend aur Google login jaanchta hai.
# Sab theek ho to chup rehta hai; kuch toote to Issue banata hai.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Jaanch
        id: c
        run: |
          set -uo pipefail
          API="https://youme-api-yjxc.onrender.com"
          PAGE="https://bhupendarsingh785.github.io/youme/"
          bad=""

          H=$(curl -sS -m 60 -o /tmp/h.json -w '%{http_code}' "$API/api/health" || echo 000)
          echo "backend: $H"
          [ "$H" = "200" ] || bad="$bad backend($H)"

          P=$(curl -sS -m 60 -o /dev/null -w '%{http_code}' "$PAGE" || echo 000)
          echo "pages: $P"
          [ "$P" = "200" ] || bad="$bad pages($P)"

          R=$(curl -sS -m 60 -o /tmp/p.json -w '%{http_code}' "$API/api/auth/providers" || echo 000)
          if [ "$R" = "200" ]; then
            OUT=$(python3 scripts/providers-check.py /tmp/p.json)
            echo "$OUT"
            case "$OUT" in
              *"READY=1"*) : ;;
              *) bad="$bad google-login" ;;
            esac
          else
            bad="$bad providers($R)"
          fi

          echo "toota:${bad:- kuch nahi}"
          echo "bad=$bad" >> "$GITHUB_OUTPUT"

      - name: Issue banao (agar toota)
        if: ${{ steps.c.outputs.bad != '' }}
        env:
          BAD: ${{ steps.c.outputs.bad }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "YouMe health: " + process.env.BAD,
              body: "Health check fail hua: " + process.env.BAD + "\n\nTime: " + new Date().toISOString()
            });
