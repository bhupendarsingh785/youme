name: Render — env jaanch (safe)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Env values jaancho
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -uo pipefail
          if [ -z "${RK:-}" ] || [ -z "${SID:-}" ]; then
            echo "::error::RENDER_API_KEY ya RENDER_SERVICE_ID secret nahi hai"; exit 1
          fi
          CODE=$(curl -sS -o /tmp/env.json -w '%{http_code}' \
            -H "Authorization: Bearer $RK" -H "Accept: application/json" \
            "https://api.render.com/v1/services/$SID/env-vars")
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Render API ne jawab nahi diya (HTTP $CODE)"
            head -c 400 /tmp/env.json || true
            exit 1
          fi
          python3 scripts/render-check.py /tmp/env.json
